<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>City services</title>
  <style>
    body { font: 20px/1.4 system-ui; margin: 24px; background: #fff; color: #111; }
    .tabs { display: flex; gap: 0; border-bottom: 2px solid #ccc; }
    .tab { border: 1px solid #ccc; border-bottom: 0; background: #f3f3f3; padding: 10px 18px; cursor: pointer; }
    .tab.current { background: #fff; font-weight: 700; box-shadow: inset 0 -3px 0 #111; }
    .panel { display: none; padding: 16px 0; }
    .panel.open { display: block; }
    .check { display: flex; gap: 8px; align-items: center; cursor: pointer; margin: 12px 0; }
    .box { width: 22px; height: 22px; border: 2px solid #111; display: grid; place-items: center; }
    .box.on { background: #111; color: #fff; }
    .ghost { opacity: .45; pointer-events: none; }
    label { display: grid; gap: 6px; margin-top: 16px; max-width: 320px; }
    input.bad { border: 2px solid #c62828; padding: 8px; }
    .err { color: #c62828; }
    details > summary { cursor: pointer; }
    details[open] > summary { font-weight: 700; }
  </style>
</head>
<body>
  <h1>City services</h1>
  <div class="tabs" role="tablist">
    <button class="tab current" id="hours-tab" type="button">Hours</button>
    <button class="tab" id="fees-tab" type="button">Fees</button>
  </div>
  <div class="panel open" id="hours">Library hours are 9 to 5.</div>
  <div class="panel" id="fees">Copying is twenty cents per page.</div>
  <nav>
    <a href="/home" id="nav-home">Home</a>
    <a href="/permits" id="nav-permits" class="current" style="font-weight:700;border-bottom:3px solid #111">Permits</a>
    <a href="/help" id="nav-help">Help</a>
  </nav>
  <div class="check" id="alerts" role="checkbox" data-on="true">
    <span class="box on" aria-hidden="true">✓</span>
    Email alerts
  </div>
  <div class="check ghost" id="fax" role="checkbox">
    <span class="box" aria-hidden="true"></span>
    Fax notices
  </div>
  <label>
    Permit number
    <input id="permit" class="bad" value="">
    <span class="err" id="permit-error">Enter a permit number.</span>
  </label>
  <details id="more">
    <summary id="more-summary">More options</summary>
    <p>Request a translation.</p>
  </details>
</body>
</html>
