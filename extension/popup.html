<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curb Cut</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <main id="popup-root" class="shell">
    <header class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>Curb Cut</h1>
      <span class="paving" aria-hidden="true"></span>
    </header>

    <label class="master" for="global-toggle">
      <span class="master-copy">
        <span id="global-toggle-title">Apply fixes</span>
        <span class="meta">All pages</span>
      </span>
      <input id="global-toggle" type="checkbox" role="switch" aria-labelledby="global-toggle-title" disabled>
      <span id="global-toggle-status" class="signal" aria-hidden="true">…</span>
    </label>

    <section class="page-panel" aria-labelledby="active-heading">
      <div class="page-head">
        <div>
          <h2 id="active-heading">Fixes on this page</h2>
          <p id="page-url" class="page-address"></p>
        </div>
        <span id="active-count" class="count" role="status" aria-label="Loading fixes">—</span>
      </div>
      <ul id="active-patches" class="patch-list"></ul>
      <p id="active-empty" class="empty" hidden></p>
      <label id="page-toggle-row" class="row-toggle" for="page-toggle" hidden>
        <span>Apply fixes on this page</span>
        <input id="page-toggle" type="checkbox" role="switch">
      </label>
    </section>

    <section class="help" aria-label="Report a barrier or try a fix">
      <details id="stuck" class="disclosure">
        <summary><span>I’m stuck</span><kbd class="hotkey" aria-hidden="true">Ctrl+Shift+U</kbd></summary>
        <div class="detail-body">
          <p class="hint">Report a barrier on a public page. Curb Cut captures a page snapshot without a screenshot.</p>
          <label class="field" for="persona-select">
            <span>How were you using the page?</span>
            <select id="persona-select">
              <option value="keyboard-only">Keyboard only</option>
              <option value="low-vision">Low vision</option>
              <option value="screen-reader-view">Screen reader view</option>
              <option value="color-blind">Color blind</option>
            </select>
          </label>
          <label class="field" for="task-input">
            <span>What were you trying to do?</span>
            <input id="task-input" type="text" maxlength="240" placeholder="Open the site search with Tab">
          </label>
          <label class="confirm" for="task-confirm">
            <input id="task-confirm" type="checkbox">
            <span>I confirm this is a public page and the task may be sent for patching.</span>
          </label>
          <div class="actions">
            <button id="send-task" type="button" class="primary">Send to local loop</button>
            <button id="download-task" type="button">Download task</button>
          </div>
        </div>
      </details>
      <p id="task-status" class="status" role="status"></p>
      <div id="instant-panel" class="instant-panel" hidden>
        <button id="instant-fix" type="button">Try experimental instant fix</button>
        <kbd class="hotkey" aria-hidden="true">Alt+Shift+F</kbd>
        <p class="hint">Shares a screenshot and page details with TypeSafe.</p>
      </div>
      <p id="instant-status" class="status" role="status"></p>
    </section>

    <details class="disclosure tools">
      <summary>Reading view and patch feed</summary>
      <div class="detail-body">
        <label class="row-toggle" for="reader-toggle">
          <span>Screen reader view</span>
          <input id="reader-toggle" type="checkbox" role="switch">
        </label>
        <label class="row-toggle" id="fixture-preview-row" for="fixture-preview-toggle" hidden>
          <span>Preview unverified fixtures</span>
          <input id="fixture-preview-toggle" type="checkbox" role="switch">
        </label>
        <label class="field" for="feed-url">
          <span>Optional verified feed URL</span>
          <input id="feed-url" type="url" placeholder="https://example.com/patches/index.json">
        </label>
        <div class="actions">
          <button id="save-feed" type="button">Save feed</button>
          <button id="refresh-feed" type="button">Refresh feed</button>
        </div>
        <p id="feed-status" class="meta" role="status"></p>
      </div>
    </details>

    <footer class="footer">
      <a id="proof-link" target="_blank" rel="noopener noreferrer">Evidence archive</a>
      <button id="instant-settings" type="button" class="text-button">Settings</button>
    </footer>
  </main>
  <script src="lib/constants.js"></script>
  <script src="lib/match.js"></script>
  <script src="lib/validate.js"></script>
  <script src="lib/select.js"></script>
  <script src="lib/sensitive.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
