name: Curb Cut gate
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: VasuBansal7576/curbcut/.github/actions/curbcut-gate@main
        with:
          preview-url: https://pr-${{ github.event.number }}.example.com
          config: curbcut.gate.json
          kane-username: ${{ secrets.KANE_USERNAME }}
          kane-access-key: ${{ secrets.KANE_ACCESS_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
